<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Go</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f4fb;--sf:#fff;--tx:#1d2150;--mu:#6a6f9a;--ln:#dfe3f3;--hl:#ffd84d;--hlt:#1d2150;--ac:#3a40c8;--rd:#d6264f;--or:#e07b00;--ok:#14935f;--tr:#e6e9f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141733;--sf:#1d2150;--tx:#eef0ff;--mu:#9ba0d0;--ln:#2e3470;--hl:#ffd84d;--hlt:#141733;--ac:#8f95ff;--rd:#ff6b8b;--or:#ffb04a;--ok:#4fd6a0;--tr:#2a2f68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141733;--sf:#1d2150;--tx:#eef0ff;--mu:#9ba0d0;--ln:#2e3470;--hl:#ffd84d;--hlt:#141733;--ac:#8f95ff;--rd:#ff6b8b;--or:#ffb04a;--ok:#4fd6a0;--tr:#2a2f68;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:34px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0 0 16px}
.sum{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.sum b{font-size:28px;font-weight:800}
.bar{height:14px;background:var(--tr);border-radius:7px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--hl);border-radius:7px;transition:width .25s}
.add{display:grid;gap:8px;margin-bottom:18px}
.add .row{display:flex;gap:8px}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;min-width:0;flex:1}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer}
.go{background:var(--hl);color:var(--hlt);font-weight:800}
.ghost{background:var(--tr);color:var(--tx)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.t{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.t.hot{border-left-color:var(--rd)}.t.soon{border-left-color:var(--or)}.t.done{border-left-color:var(--ok);opacity:.7}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t h3{margin:0;font-size:18px;font-weight:600}
.t.done h3{text-decoration:line-through}
.meta{color:var(--mu);font-size:14px}
.due{font-weight:600;font-size:14px;white-space:nowrap}
.hot .due{color:var(--rd)}.soon .due{color:var(--or)}
.pr{display:flex;align-items:center;gap:10px;margin-top:10px}
.pr input[type=range]{padding:0;accent-color:var(--ac);flex:1}
.pct{font-weight:800;min-width:46px;text-align:right}
.x{background:none;color:var(--mu);padding:4px 8px;font-size:18px}
.set{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 0;align-items:center}
.set label{color:var(--mu);font-size:14px}
.set select{flex:none}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:496px;margin:0 auto;background:var(--hl);color:var(--hlt);border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;z-index:20;white-space:pre-line}
.empty{color:var(--mu);text-align:center;padding:24px 0}
</style></head>
<body>
<div id="toast" role="alert"></div>
<main>
<h1>Agenda Go</h1>
<p class="sub">Tus deberes al día, con avisos que no se olvidan.</p>
<div class="sum"><span class="meta">Progreso general</span><br><b id="all">0 %</b><div class="bar"><i id="allbar" style="width:0"></i></div></div>
<div class="add">
<input id="ti" placeholder="¿Qué tienes que hacer?" aria-label="Tarea">
<div class="row"><input id="su" placeholder="Materia" aria-label="Materia"><input id="da" type="date" aria-label="Fecha de entrega"></div>
<button class="go" id="ad">Añadir tarea</button>
</div>
<div id="list"></div>
<div class="set">
<label for="fr">Avisarme</label>
<select id="fr"><option value="2">2 veces al día</option><option value="4">4 veces al día</option><option value="6">6 veces al día</option></select>
<button class="ghost" id="no">Activar avisos</button>
<button class="ghost" id="te">Probar aviso</button>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
let tasks=[],freq=4,timer=null,tt=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const x=new Date();x.setDate(x.getDate()+d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const left=t=>Math.round((new Date(t.due+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const lab=n=>n<0?'Venció hace '+(-n)+' d':n===0?'Vence hoy':n===1?'Vence mañana':'En '+n+' días';
function seed(){tasks=[{id:1,t:'Informe de laboratorio',s:'Química',due:iso(1),p:40},{id:2,t:'Ejercicios del capítulo 5',s:'Matemáticas',due:iso(4),p:10},{id:3,t:'Leer el cuento y resumirlo',s:'Lengua',due:iso(0),p:70}]}
function load(){try{const r=localStorage.getItem('ag');if(r)tasks=JSON.parse(r);else seed();const f=localStorage.getItem('agf');if(f)freq=+f}catch(e){seed()}}
function save(){try{localStorage.setItem('ag',JSON.stringify(tasks));localStorage.setItem('agf',freq)}catch(e){}sched()}
function render(){
  const l=$('#list');
  const arr=[...tasks].sort((a,b)=>(a.p>=100)-(b.p>=100)||a.due.localeCompare(b.due));
  l.innerHTML=arr.length?arr.map(t=>{const n=left(t),d=t.p>=100;const c=d?'done':n<=0?'hot':n<=2?'soon':'';
    return `<div class="t ${c}" data-id="${t.id}"><div class="top"><div><h3>${esc(t.t)}</h3><div class="meta">${esc(t.s||'Sin materia')}</div></div><div style="text-align:right"><div class="due">${d?'Hecha':lab(n)}</div><button class="x" data-del aria-label="Borrar">×</button></div></div><div class="pr"><input type="range" min="0" max="100" step="5" value="${t.p}" aria-label="Progreso"><span class="pct">${t.p} %</span></div></div>`}).join(''):'<div class="empty">No tienes tareas. Añade la primera arriba.</div>';
  const a=tasks.length?Math.round(tasks.reduce((s,t)=>s+t.p,0)/tasks.length):0;
  $('#all').textContent=a+' %';$('#allbar').style.width=a+'%';
}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',9000)}
function notify(m){toast(m);try{if('Notification' in window&&Notification.permission==='granted')new Notification('Agenda Go',{body:m})}catch(e){}}
function remind(test){
  const p=tasks.filter(t=>t.p<100&&left(t)<=3).sort((a,b)=>a.due.localeCompare(b.due));
  if(!p.length){if(test)toast('No tienes tareas urgentes. ¡Bien!');return}
  notify(p.slice(0,3).map(t=>'• '+t.t+': '+lab(left(t)).toLowerCase()+' ('+t.p+' % hecho)').join('\n'));
}
async function sched(){
  const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN)return;
  try{
    await LN.requestPermissions();
    const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications});
    const H={2:[9,19],4:[8,12,16,20],6:[8,10,12,15,18,21]}[freq]||[9,19],now=Date.now(),out=[];let id=1;
    tasks.filter(t=>t.p<100).forEach(t=>{const n=left(t);
      for(let d=Math.max(0,n-3);d<=Math.max(n,0);d++)H.forEach(h=>{
        const at=new Date();at.setHours(h,0,0,0);at.setDate(at.getDate()+d);
        if(at.getTime()>now&&out.length<400)out.push({id:id++,title:'Agenda Go',body:t.t+': '+lab(n-d).toLowerCase()+' ('+t.p+' % hecho)',schedule:{at,allowWhileIdle:true}});
      });
    });
    if(out.length)await LN.schedule({notifications:out});
  }catch(e){}
}
function setTimer(){clearInterval(timer);timer=setInterval(()=>remind(false),3600000)}
$('#ad').onclick=()=>{const t=$('#ti').value.trim(),d=$('#da').value;if(!t){toast('Escribe qué tienes que hacer.');return}if(!d){toast('Elige la fecha de entrega.');return}
  tasks.push({id:Date.now(),t,s:$('#su').value.trim(),due:d,p:0});$('#ti').value='';$('#su').value='';save();render()};
$('#list').addEventListener('input',e=>{if(e.target.type==='range'){const c=e.target.closest('.t');c.querySelector('.pct').textContent=e.target.value+' %'}});
$('#list').addEventListener('change',e=>{if(e.target.type==='range'){const t=tasks.find(x=>x.id==e.target.closest('.t').dataset.id);t.p=+e.target.value;save();render()}});
$('#list').addEventListener('click',e=>{if(e.target.hasAttribute('data-del')){const id=e.target.closest('.t').dataset.id;tasks=tasks.filter(x=>x.id!=id);save();render()}});
$('#fr').onchange=e=>{freq=+e.target.value;save();setTimer();toast('Listo: te avisaré '+freq+' veces al día.')};
$('#no').onclick=async()=>{try{const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;const r=LN?(await LN.requestPermissions()).display:await Notification.requestPermission();sched();toast(r==='granted'?'Avisos del sistema activados.':'El navegador no permitió los avisos; verás los avisos dentro de la app.')}catch(e){toast('Aquí verás los avisos dentro de la app.')}};
$('#te').onclick=()=>remind(true);
load();$('#fr').value=String(freq);$('#da').value=iso(1);render();setTimer();sched();setTimeout(()=>remind(false),1500);
</script>
</body></html>
